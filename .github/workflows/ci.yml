# SPDX-License-Identifier: AGPL-3.0-or-later
# CI per worklog/refactor/03-characterization-tests.md §4.6:
#   node    — svelte-check (advisory), the fast verify:* chains, the WASM pin and the Node-tier
#             goldens; on a PR, tests/golden/** may only change together with its CHANGELOG.
#   native  — the retaining engine's C++ unit tests (same sources as static/wasm/retaining).
#   browser — Playwright (Chromium) end-to-end; the golden browser journeys plug in here
#             once tests/e2e/golden-journey.spec.mjs exists (separate task).
name: ci
on:
  push:
    branches: [main, 'v*']
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: WASM artefacts match the golden pin
        run: node scripts/golden/wasm-hash.mjs
      - name: svelte-check (advisory — pre-existing type errors, see worklog/PROGRESS.md)
        run: npm run check
        continue-on-error: true
      - run: npm run verify:core
      - run: npm run golden:check
      - name: golden changelog guard
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -q '^tests/golden/'; then
            echo "$changed" | grep -q '^tests/golden/CHANGELOG.md' || { echo 'tests/golden/** changed without a CHANGELOG.md entry'; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-actual
          path: tests/golden/.actual
          if-no-files-found: ignore

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: retaining engine C++ tests
        run: g++ -std=c++20 -O2 -I src/wasm/retaining src/wasm/retaining/test_native.cpp -o /tmp/rwtest && /tmp/rwtest

  browser:
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Browser-tier goldens (tests/e2e/golden-journey.spec.mjs, npm run golden:browser) are
      # added by the browser task; until then the existing e2e spec is the gate.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            test-results
            tests/golden/.actual
          if-no-files-found: ignore
