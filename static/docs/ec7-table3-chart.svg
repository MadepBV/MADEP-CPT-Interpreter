<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">NEN Table 3 / EC7 classification chart</title>
  <desc id="desc">Schematic qc-Rf classification map derived from the implemented NEN Table 3 and EC7 ranges.</desc>
  <style>
    text { font-family: Georgia, "Times New Roman", serif; fill: #1b1b19; }
    .axis { stroke: #2b2b28; stroke-width: 2; }
    .grid { stroke: #cfcbbf; stroke-width: 1; stroke-dasharray: 4 6; }
    .label { font-size: 16px; }
    .tick { font-size: 14px; }
    .zone { stroke: rgba(27,27,25,.45); stroke-width: 1.5; }
    .zand { fill: rgba(208, 210, 199, 0.85); }
    .zandlh { fill: rgba(244, 192, 209, 0.85); }
    .grind { fill: rgba(240, 153, 123, 0.85); }
    .grindkh { fill: rgba(232, 175, 140, 0.88); }
    .leem { fill: rgba(250, 199, 117, 0.88); }
    .leemzh { fill: rgba(252, 219, 161, 0.9); }
    .klei { fill: rgba(175, 169, 236, 0.88); }
    .kleizh { fill: rgba(196, 189, 242, 0.9); }
    .veen { fill: rgba(192, 221, 151, 0.92); }
    .caption { font-size: 18px; font-weight: 600; }
    .small { font-size: 13px; fill: #55524a; }
  </style>

  <rect x="0" y="0" width="980" height="620" fill="#f7f4ef"/>
  <text x="60" y="42" class="caption">Schematic NEN Tabel 3 / EC7 q<tspan baseline-shift="sub">c</tspan>–R<tspan baseline-shift="sub">f</tspan> map</text>
  <text x="60" y="66" class="small">Derived from the implemented Table 3 ranges; shown here as a documentation aid for the direct subtype classification route.</text>

  <!-- Plot frame -->
  <line x1="110" y1="540" x2="900" y2="540" class="axis"/>
  <line x1="110" y1="540" x2="110" y2="110" class="axis"/>

  <!-- Horizontal bands for Rf -->
  <line x1="110" y1="454" x2="900" y2="454" class="grid"/>
  <line x1="110" y1="390" x2="900" y2="390" class="grid"/>
  <line x1="110" y1="304" x2="900" y2="304" class="grid"/>
  <line x1="110" y1="196" x2="900" y2="196" class="grid"/>

  <!-- Vertical qc grid -->
  <line x1="222" y1="110" x2="222" y2="540" class="grid"/>
  <line x1="334" y1="110" x2="334" y2="540" class="grid"/>
  <line x1="446" y1="110" x2="446" y2="540" class="grid"/>
  <line x1="558" y1="110" x2="558" y2="540" class="grid"/>
  <line x1="670" y1="110" x2="670" y2="540" class="grid"/>
  <line x1="782" y1="110" x2="782" y2="540" class="grid"/>

  <!-- Zones -->
  <!-- Veen -->
  <rect x="110" y="110" width="790" height="86" class="zone veen"/>
  <!-- Klei 3-6 -->
  <rect x="110" y="196" width="112" height="108" class="zone klei"/>
  <rect x="222" y="196" width="112" height="108" class="zone klei"/>
  <rect x="334" y="196" width="112" height="108" class="zone klei"/>
  <rect x="446" y="196" width="454" height="108" class="zone klei"/>
  <!-- Klei zandhoudend 2-5 -->
  <rect x="110" y="245" width="112" height="145" class="zone kleizh"/>
  <rect x="222" y="245" width="112" height="145" class="zone kleizh"/>
  <rect x="334" y="245" width="112" height="145" class="zone kleizh"/>
  <rect x="446" y="245" width="454" height="145" class="zone kleizh"/>
  <!-- Leem 2-4 -->
  <rect x="110" y="304" width="112" height="150" class="zone leem"/>
  <rect x="222" y="304" width="112" height="150" class="zone leem"/>
  <rect x="334" y="304" width="112" height="150" class="zone leem"/>
  <rect x="446" y="304" width="454" height="150" class="zone leem"/>
  <!-- Leem zandhoudend 1-3 -->
  <rect x="110" y="390" width="112" height="150" class="zone leemzh"/>
  <rect x="222" y="390" width="112" height="150" class="zone leemzh"/>
  <rect x="334" y="390" width="112" height="150" class="zone leemzh"/>
  <rect x="446" y="390" width="454" height="150" class="zone leemzh"/>
  <!-- Sand clean <1 -->
  <rect x="334" y="454" width="112" height="86" class="zone zand"/>
  <rect x="446" y="454" width="112" height="86" class="zone zand"/>
  <rect x="558" y="454" width="112" height="86" class="zone zand"/>
  <rect x="670" y="454" width="230" height="86" class="zone zand"/>
  <!-- Sand (lh) 1-2 -->
  <rect x="334" y="422" width="112" height="32" class="zone zandlh"/>
  <rect x="446" y="422" width="112" height="32" class="zone zandlh"/>
  <rect x="558" y="422" width="112" height="32" class="zone zandlh"/>
  <rect x="670" y="422" width="230" height="32" class="zone zandlh"/>
  <!-- Gravel clean <1 -->
  <rect x="558" y="454" width="112" height="86" class="zone grind"/>
  <rect x="670" y="454" width="230" height="86" class="zone grind"/>
  <!-- Gravel kh 1-2 -->
  <rect x="558" y="422" width="112" height="32" class="zone grindkh"/>
  <rect x="670" y="422" width="230" height="32" class="zone grindkh"/>

  <!-- Zone labels -->
  <text x="715" y="158" text-anchor="middle" class="label">Veen (R<tspan baseline-shift="sub">f</tspan> &gt; 6%)</text>
  <text x="510" y="238" text-anchor="middle" class="label">Klei</text>
  <text x="510" y="275" text-anchor="middle" class="small">R<tspan baseline-shift="sub">f</tspan> 3–6%</text>
  <text x="510" y="345" text-anchor="middle" class="label">Klei zandhoudend</text>
  <text x="510" y="381" text-anchor="middle" class="small">R<tspan baseline-shift="sub">f</tspan> 2–5%</text>
  <text x="510" y="353" text-anchor="middle" class="label"></text>
  <text x="510" y="356" text-anchor="middle" class="small"></text>
  <text x="510" y="353" text-anchor="middle"></text>
  <text x="510" y="360" text-anchor="middle"></text>
  <text x="510" y="360" text-anchor="middle"></text>
  <text x="510" y="347" text-anchor="middle" class="label"></text>
  <text x="510" y="389" text-anchor="middle" class="label">Leem</text>
  <text x="510" y="424" text-anchor="middle" class="small">R<tspan baseline-shift="sub">f</tspan> 2–4%</text>
  <text x="510" y="474" text-anchor="middle" class="label">Zandhoudende leem</text>
  <text x="510" y="509" text-anchor="middle" class="small">R<tspan baseline-shift="sub">f</tspan> 1–3%</text>
  <text x="390" y="500" text-anchor="middle" class="label">Zand</text>
  <text x="390" y="525" text-anchor="middle" class="small">clean / R<tspan baseline-shift="sub">f</tspan> &lt; 1%</text>
  <text x="780" y="500" text-anchor="middle" class="label">Grind</text>
  <text x="780" y="525" text-anchor="middle" class="small">clean / R<tspan baseline-shift="sub">f</tspan> &lt; 1%</text>
  <text x="390" y="438" text-anchor="middle" class="small">Leemhoudend zand · R<tspan baseline-shift="sub">f</tspan> 1–2%</text>
  <text x="780" y="438" text-anchor="middle" class="small">Grind (kh) · R<tspan baseline-shift="sub">f</tspan> 1–2%</text>

  <!-- Axis labels -->
  <text x="505" y="590" text-anchor="middle" class="label">Cone resistance q<tspan baseline-shift="sub">c</tspan> [MPa]</text>
  <text x="28" y="325" transform="rotate(-90 28 325)" text-anchor="middle" class="label">Friction ratio R<tspan baseline-shift="sub">f</tspan> [%]</text>

  <!-- X ticks -->
  <text x="110" y="565" text-anchor="middle" class="tick">0.2</text>
  <text x="222" y="565" text-anchor="middle" class="tick">0.5</text>
  <text x="334" y="565" text-anchor="middle" class="tick">1</text>
  <text x="446" y="565" text-anchor="middle" class="tick">2</text>
  <text x="558" y="565" text-anchor="middle" class="tick">4</text>
  <text x="670" y="565" text-anchor="middle" class="tick">10</text>
  <text x="782" y="565" text-anchor="middle" class="tick">20</text>
  <text x="900" y="565" text-anchor="middle" class="tick">≥99</text>

  <!-- Y ticks -->
  <text x="92" y="545" text-anchor="end" class="tick">0</text>
  <text x="92" y="459" text-anchor="end" class="tick">1</text>
  <text x="92" y="395" text-anchor="end" class="tick">2</text>
  <text x="92" y="309" text-anchor="end" class="tick">3</text>
  <text x="92" y="201" text-anchor="end" class="tick">6</text>
</svg>
