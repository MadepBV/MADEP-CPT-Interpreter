<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F4EF" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111110" />
		<script>
			// Pre-paint theme: an explicit choice ('light' | 'dark', key `madep-theme`, see src/lib/styles/theme.ts)
			// lands on <html data-theme> before the first paint; no choice = follow the OS (tokens.css).
			(function () {
				try {
					var t = localStorage.getItem('madep-theme');
					if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
				} catch (e) {}
			})();
		</script>
		<link rel="icon" type="image/svg+xml" href="/MADEP_icon.svg" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<script defer data-domain="cpt.madep.be" src="https://analytics.madep.digital/js/script.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
